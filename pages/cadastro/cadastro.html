    <main>
        <h1>Cadastrar novos Usuários!</h1>
        <form id="form_cadastro">
            <label for="nome">Nome</label>
            <input type="text" name="nome" id="nome" placeholder="Fulano de Tal..." required>

            <label for="data_nasc">Data de Nascimento</label>
            <input type="date" name="birth_date" id="data_nasc" required>

            <label for="email">E-mail</label>
            <input type="email" name="email" id="email" placeholder="fulano@gmail.com" required>

            <div id="radio-buttons">
                <span>Você é:</span>
                <div class="radio-button-option">
                    <input type="radio" name="tipo_cadastro" id="prof" >
                    <label for="prof">Professor</label>
                </div>
                <div class="radio-button-option">
                    <input type="radio" name="tipo_cadastro" id="aluno" required>
                    <label for="aluno">Aluno</label>
                </div>
            </div>
            <label for="fruta">Qual sua fruta favorita?</label>
            <input type="text" name="fruta" id="fruta" placeholder="Pitaia" required>
        </form>
        <span>Já tem conta? <a href="../login/login.html">Entre aqui</a>.</span>
        <button id="enviar" form="form_cadastro" type="submit">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><!--!Font Awesome Free v7.2.0 by @fontawesome - https://fontawesome.com License - https://fontawesome.com/license/free Copyright 2026 Fonticons, Inc.--><path d="M322.5 351.7L523.4 150.9L391 520.3L322.5 351.7zM489.4 117L288.6 317.8L120 249.3L489.4 117zM70.1 280.8L275.9 364.4L359.5 570.2C364.8 583.3 377.6 591.9 391.8 591.9C406.5 591.9 419.6 582.7 424.6 568.8L602.6 72C606.1 62.2 603.6 51.4 596.3 44C589 36.6 578.1 34.2 568.3 37.7L71.4 215.7C57.5 220.7 48.3 233.8 48.3 248.5C48.3 262.7 56.9 275.5 70 280.8z"/></svg>
            Enviar
